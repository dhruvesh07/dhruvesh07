<svg width="100%" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="blobPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4C1D95" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4C1D95" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="panelStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4C1D95" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6D28D9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="#000000"/>

  <circle cx="160" cy="70" r="170" fill="url(#blobPurple)" filter="url(#blur1)">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1060" cy="260" r="190" fill="url(#blobIndigo)" filter="url(#blur1)">
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="20" r="140" fill="url(#blobPurple)" filter="url(#blur1)" opacity="0.3">
    <animate attributeName="cy" values="20;55;20" dur="8s" repeatCount="indefinite"/>
  </circle>

  <rect x="70" y="55" width="1060" height="210" rx="26" fill="rgba(255,255,255,0.035)" stroke="url(#panelStroke)" stroke-width="1.4"/>
  <rect x="90" y="58" width="1020" height="1.5" fill="#ffffff" opacity="0.12"/>

  <text x="600" y="152" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="url(#textGrad)" filter="url(#softGlow)" opacity="0.55">DHRUVESH DABHADE</text>
  <text x="600" y="152" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="url(#textGrad)">DHRUVESH DABHADE</text>

  <text x="600" y="196" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#C4B5FD" opacity="0.85">Software Engineer · AI/ML Engineer · Full Stack Developer</text>

  <line x1="470" y1="226" x2="730" y2="226" stroke="url(#lineGrad)" stroke-width="2.5">
    <animate attributeName="x1" values="470;440;470" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="730;760;730" dur="4s" repeatCount="indefinite"/>
  </line>
</svg>
