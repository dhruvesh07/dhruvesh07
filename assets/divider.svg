<svg width="100%" viewBox="0 0 1200 8" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0"/>
      <stop offset="20%" stop-color="#c084fc" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="80%" stop-color="#a855f7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>

    <filter id="divGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <line x1="0" y1="4" x2="1200" y2="4" stroke="url(#divGrad)" stroke-width="4" filter="url(#divGlow)" opacity="0.85">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </line>

  <line x1="0" y1="4" x2="1200" y2="4" stroke="url(#divGrad)" stroke-width="1.5"/>
</svg>
