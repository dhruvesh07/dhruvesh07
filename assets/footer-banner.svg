<svg width="100%" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05020a"/>
      <stop offset="50%" stop-color="#0c0418"/>
      <stop offset="100%" stop-color="#06020c"/>
    </linearGradient>

    <radialGradient id="fBlobViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="fBlobPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#831843" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="fTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="fGlassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>

    <filter id="fBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>

    <filter id="fNeon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="200" fill="url(#fBgGrad)" rx="16"/>

  <!-- Liquid Ambient Blobs -->
  <circle cx="150" cy="150" r="160" fill="url(#fBlobViolet)" filter="url(#fBlur)">
    <animate attributeName="opacity" values="0.5;0.95;0.5" dur="7s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1050" cy="50" r="170" fill="url(#fBlobPink)" filter="url(#fBlur)">
    <animate attributeName="opacity" values="0.6;0.95;0.6" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Glass Card Container -->
  <rect x="100" y="35" width="1000" height="130" rx="24" fill="rgba(15, 7, 32, 0.6)" stroke="url(#fGlassBorder)" stroke-width="1.6" filter="url(#fNeon)"/>

  <!-- Glass Top Reflection Line -->
  <path d="M 130 37 Q 600 37 1070 37" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" fill="none"/>

  <!-- Quote Text -->
  <text x="600" y="108" text-anchor="middle" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="21" font-style="italic" font-weight="600" fill="url(#fTextGrad)" filter="url(#fNeon)">"Code is the closest thing we have to magic — write it with intention."</text>
</svg>
