<svg width="100%" viewBox="0 0 1200 170" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="fBlobPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fBlobIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4C1D95" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4C1D95" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="fPanelStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4C1D95" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="fBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
  </defs>

  <rect width="1200" height="170" fill="#000000"/>

  <circle cx="120" cy="140" r="150" fill="url(#fBlobPurple)" filter="url(#fBlur)">
    <animate attributeName="opacity" values="0.5;0.85;0.5" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="30" r="160" fill="url(#fBlobIndigo)" filter="url(#fBlur)">
    <animate attributeName="opacity" values="0.55;0.85;0.55" dur="7s" repeatCount="indefinite"/>
  </circle>

  <rect x="180" y="35" width="840" height="100" rx="20" fill="rgba(255,255,255,0.03)" stroke="url(#fPanelStroke)" stroke-width="1.2"/>

  <text x="600" y="93" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-style="italic" fill="url(#fTextGrad)">Code is the closest thing we have to magic — write it with intention.</text>
</svg>
